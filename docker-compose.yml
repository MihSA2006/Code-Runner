services:
  python-sandbox:
    build:
      context: ./sandboxes/python
    image: coderunner-python

  javascript-sandbox:
    build:
      context: ./sandboxes/javascript
    image: coderunner-javascript

  c-sandbox:
    build:
      context: ./sandboxes/c
    image: coderunner-c

  api:
    build: .
    image: coderunner-api
    container_name: coderunner-api
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - db_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=/app/data/coderunner.db
    depends_on:
      - python-sandbox
      - javascript-sandbox
      - c-sandbox
    restart: unless-stopped

volumes:
  db_data:
